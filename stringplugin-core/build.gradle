plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'java-gradle-plugin'
    id 'com.vanniktech.maven.publish'
}

group = 'io.github.dawnuu'
version = VERSION

configurations.all {
    resolutionStrategy {
        force "com.android.tools.build:gradle:7.4.0"
        force "com.android.tools.build:gradle-api:7.4.0"
    }
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()
    implementation "org.ow2.asm:asm:9.10.1"
    implementation "org.ow2.asm:asm-tree:9.10.1"
    implementation "org.ow2.asm:asm-analysis:9.10.1"
    implementation "com.squareup:javawriter:2.5.1"
    compileOnly "com.android.tools.build:gradle:8.13.2"
    implementation project(":stringplugin-common")
    testImplementation "junit:junit:4.13.2"
}


gradlePlugin {
    plugins {
        stringblur {
            id = 'stringblur'
            implementationClass = 'com.android.string.plugin.StringBlurPlugin'
        }
        ioGithubDawnuuStringblur {
            id = 'io.github.dawnuu.stringblur'
            implementationClass = 'com.android.string.plugin.StringBlurPlugin'
        }
    }
}

// The legacy plugin ID is available via buildscript and Maven Local.
// Its marker uses the unowned 'stringblur' namespace and cannot go to Central.
tasks.withType(org.gradle.api.publish.maven.tasks.PublishToMavenRepository).configureEach {
    if (name == 'publishStringblurPluginMarkerMavenPublicationToMavenCentralRepository') {
        enabled = false
    }
}

mavenPublishing {
    coordinates("io.github.dawnuu", "stringblur", VERSION)
    publishToMavenCentral()
    signAllPublications()

    pom {
        name = "StringBlur"
        description = "An Android Gradle plugin that encrypts string constants during the build."
        url = "https://github.com/dawnuu/StringBlur"
        licenses {
            license {
                name = "Apache License, Version 2.0"
                url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                distribution = "repo"
            }
        }
        developers {
            developer {
                id = "dawnuu"
                name = "dawnuu"
                email = "dawnuu@126.com"
                organization = "dawnuu"
                organizationUrl = "https://github.com/dawnuu"
            }
        }
        scm {
            url = "https://github.com/dawnuu/StringBlur"
            connection = "scm:git:https://github.com/dawnuu/StringBlur.git"
            developerConnection = "scm:git:ssh://git@github.com/dawnuu/StringBlur.git"
        }
    }
}
