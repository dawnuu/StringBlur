plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'com.vanniktech.maven.publish'
}

def getVersionFromGradleProperties() {
    def gradlePropsFile = file("../gradle.properties")
    if (gradlePropsFile.exists()) {
        def props = new Properties()
        gradlePropsFile.withInputStream { props.load(it) }
        def version = props.getProperty("VERSION")
        if (version != null && version != "unspecified") {
            return version
        }
    }
    return "1.0.2-SNAPSHOT" // 默认回退
}

// 生成包含VERSION的Kotlin文件，这样插件运行时就能访问了
task generateVersionConstant {
    def outputDir = file("$buildDir/generated-src")
    inputs.property "version", getVersionFromGradleProperties()
    outputs.dir outputDir

    doLast {
        def versionFile = file("$outputDir/com/android/string/plugin/VersionConstants.kt")
        versionFile.parentFile.mkdirs()
        versionFile.text = """
package com.android.string.plugin

// 自动生成的版本常量 - 包含gradle.properties中的VERSION
const val GRADLE_VERSION = \"${getVersionFromGradleProperties()}\"
"""
    }
}

sourceSets.main.kotlin.srcDir "$buildDir/generated-src"
compileKotlin.dependsOn generateVersionConstant
tasks.matching { it.name == "sourcesJar" }.configureEach {
    dependsOn generateVersionConstant
}
mavenPublishing {
    coordinates("io.github.dawnuu", "common", getVersionFromGradleProperties())
    publishToMavenCentral()
    signAllPublications()

    pom {
        name = "StringBlur Common"
        description = "Shared APIs for the StringBlur Gradle plugin."
        url = "https://github.com/erliangv/StringBlur"
        licenses {
            license {
                name = "Apache License, Version 2.0"
                url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                distribution = "repo"
            }
        }
        developers {
            developer {
                id = "dawnuu"
                name = "dawnuu"
                email = "dawnuu@126.com"
                organization = "dawnuu"
                organizationUrl = "https://github.com/erliangv"
            }
        }
        scm {
            url = "https://github.com/erliangv/StringBlur"
            connection = "scm:git:https://github.com/erliangv/StringBlur.git"
            developerConnection = "scm:git:ssh://git@github.com/erliangv/StringBlur.git"
        }
    }
}
